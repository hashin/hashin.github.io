<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function(){
        try{
          var t = localStorage.getItem('theme');
          var wantsDark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if(wantsDark) document.documentElement.classList.add('dark');
        }catch(e){}
      })();
    </script>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Malayalam:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="icon" href="{{ site.baseurl }}/images/icon.png" type="image/icon type">

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <header class="masthead">
      <div class="kicker">{{ site.tagline }}</div>
      <h1 class="wordmark"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
      <p class="desc">{{ site.description }}</p>
      <nav class="primary">
        {% if page.layout == 'post' %}<a href="{{ site.baseurl }}/">Essay</a>{% endif %}
        <a href="{{ site.baseurl }}/about/">About Me</a>
      </nav>
      <button class="darkbtn" onclick="hjToggleDark()" title="Toggle Dark Mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </header>

    <main class="page-content">
      {{ content }}
    </main>

    <footer class="site">
      {% include footer-links.html %}
    </footer>

    <script>
      function hjToggleDark(){
        var root = document.documentElement;
        var isDark = root.classList.toggle('dark');
        try{ localStorage.setItem('theme', isDark ? 'dark' : 'light'); }catch(e){}
      }
    </script>

    {% include analytics.html %}
  </body>
</html>
